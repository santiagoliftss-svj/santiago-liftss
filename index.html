:root{
  --bg:#000;
  --ink:#fbf6ff; --ink2:#e9def5; --mute:#b1a2c4; --faint:#75688a;
  --pink:#ff4fb4; --pink2:#ff8fd2; --hot:#ff2e95; --mag:#df52ff; --pur:#9d5cff; --vio:#7a5cff; --blu:#5d8bff; --ice:#ffe6f5;
  --ok:#7dffc4; --bad:#ff5c7a;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --card:linear-gradient(180deg,rgba(34,20,46,.58),rgba(12,8,18,.62));
  --card-solid:#120c19;
  --grad:linear-gradient(120deg,#ff4fb4 0%,#df52ff 45%,#9d5cff 72%,#5d8bff 100%);
  --edge-pink:linear-gradient(140deg,rgba(255,225,245,.95),rgba(255,79,180,.45) 28%,rgba(157,92,255,.18) 58%,rgba(140,180,255,.85));
  --edge:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,.07) 35%,rgba(255,255,255,.02) 62%,rgba(255,200,240,.35));
  --chrome:linear-gradient(180deg,#fff 0%,#ece6f3 24%,#8d8798 47%,#faf7fd 53%,#bab3c6 74%,#fff 100%);
  --chrome-pink:linear-gradient(180deg,#fff 0%,#ffd9f0 26%,#c86aa8 47%,#fff2fb 53%,#e0a8d6 74%,#fff 100%);
  --sheen:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%);
  --f-disp:"AntonSL","Anton","DIN Condensed","HelveticaNeue-CondensedBlack","Arial Narrow",Impact,sans-serif;
  --f-body:"Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --dim:.5; --blur:0px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:#000}
@supports (height:100dvh){html{height:100dvh}}
body{height:100%;margin:0;padding:0;overflow:hidden;background:#000;color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0;touch-action:manipulation;-webkit-appearance:none;appearance:none;border-radius:0}
img{display:block;max-width:100%}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--pink2);outline-offset:3px;border-radius:14px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type ---------- */
.disp{font-family:var(--f-disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.mono{font:500 .7rem/1.25 var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 .68rem/1 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.eyebrow::before{content:"";width:18px;height:1px;background:currentColor;flex:none}
.eyebrow.pink{color:var(--pink2)}
.chrome,.chrome-pink{padding-top:.2em;margin-top:-.2em}
.chrome{background:var(--sheen),var(--chrome);background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:130% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 7s cubic-bezier(.45,0,.2,1) 1s infinite}
.chrome-pink{background:var(--sheen),var(--chrome-pink);background-size:300% 100%,100% 100%;background-repeat:no-repeat;background-position:130% 0,0 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 6s cubic-bezier(.45,0,.2,1) .4s infinite}
.gradtx{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes sweep{0%{background-position:130% 0,0 0}55%,100%{background-position:-30% 0,0 0}}
.num{font-variant-numeric:tabular-nums}

/* ---------- background layer ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000;pointer-events:none}
.bg-art{position:absolute;inset:-4%;display:flex;align-items:center;justify-content:center;filter:blur(var(--blur));transform:translateZ(0);transition:opacity .6s var(--ease-out)}
.bg-art img{width:100%;height:100%;object-fit:contain;object-position:50% 42%;opacity:0;transition:opacity .8s var(--ease-out)}
.bg-art img.on{opacity:1}
.bg-art.cover img{object-fit:cover;object-position:50% 50%}
.bg-art.logo img{width:165%;max-width:none;height:auto;transform:rotate(-9deg);filter:brightness(.9)}
.bg-art.logo img.on{opacity:.26}
.bg-dim{position:absolute;inset:0;background:#000;opacity:var(--dim);transition:opacity .4s}
.bg-glow{position:absolute;inset:-20%;background:
  radial-gradient(42% 30% at 12% 92%,rgba(255,46,149,.30),transparent 70%),
  radial-gradient(46% 34% at 92% 8%,rgba(122,92,255,.28),transparent 70%),
  radial-gradient(30% 22% at 80% 70%,rgba(223,82,255,.12),transparent 70%);
  animation:glowdrift 18s ease-in-out infinite alternate}
#sparks{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 1px,transparent 1px 4px)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glowdrift{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(2%,-2%,0) scale(1.06)}}
body[data-view="timer"] .bg-dim{opacity:calc(var(--dim) + .12)}

/* ---------- app shell ---------- */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.top{flex:none;height:56px;display:flex;align-items:center;gap:10px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));position:relative;z-index:5}
.brand{display:flex;align-items:center;height:48px;border-radius:12px;flex:none}
.brand img{height:40px;width:auto;filter:drop-shadow(0 0 10px rgba(255,79,180,.35))}
.top .sp{flex:1}
.pill-live{display:none;align-items:center;gap:8px;height:34px;padding:0 12px 0 10px;border-radius:999px;font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;color:var(--ink2);background:rgba(255,255,255,.06);border:1px solid var(--line2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.pill-live.on{display:inline-flex}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid var(--pink);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.iconbtn{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .16s var(--ease-out),background-color .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.on{color:#fff;background:linear-gradient(135deg,rgba(255,79,180,.42),rgba(157,92,255,.32));border-color:rgba(255,150,215,.7);box-shadow:0 0 16px -2px rgba(255,79,180,.6)}

main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px max(16px,env(safe-area-inset-right,0px)) 150px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;visibility:hidden;opacity:0}
.view::-webkit-scrollbar{display:none}
.view.on{visibility:visible;opacity:1}
.view.in{animation:vin .46s var(--ease-out) both}
.view.out{visibility:visible;animation:vout .22s ease-in both;pointer-events:none}
@keyframes vin{from{opacity:0;transform:translate3d(0,12px,0) scale(.985);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes vout{to{opacity:0;transform:scale(.985);filter:blur(6px)}}
.view.in .st{animation:rise .55s var(--ease-out) both;animation-delay:calc(var(--i,0) * 55ms + 60ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font:400 1.7rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.sec-h .mono{color:var(--faint)}
.vt{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.vt h1{font:400 3.3rem/.88 var(--f-disp);text-transform:uppercase;letter-spacing:.005em}
.lnk{color:var(--pink2);font:500 .7rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:8px 0;display:inline-flex;align-items:center;gap:4px}
.lnk svg{width:14px;height:14px}

/* ---------- glass + buttons ---------- */
.edge{position:relative}
.edge::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.card{background:var(--card);border-radius:24px;-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:0 24px 48px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07)}
.gp,.gn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font:400 1.04rem/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:transform .18s var(--ease-out),filter .25s,box-shadow .3s,opacity .2s}
.gp{color:#fff;background:
    radial-gradient(130% 110% at 50% -28%,rgba(255,255,255,.62),rgba(255,255,255,0) 44%),
    radial-gradient(80% 130% at 0% 105%,rgba(255,46,149,.85),transparent 62%),
    radial-gradient(80% 130% at 100% -5%,rgba(110,92,255,.8),transparent 64%),
    linear-gradient(135deg,rgba(255,79,180,.5),rgba(157,92,255,.42));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -12px 22px rgba(255,46,149,.38),inset 0 0 0 1px rgba(255,200,238,.25),0 12px 30px -10px rgba(255,46,149,.75),0 0 36px -6px rgba(157,92,255,.6);
  -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);
  text-shadow:0 0 14px rgba(255,150,215,.95),0 1px 0 rgba(110,0,60,.45)}
.gp::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:var(--edge-pink);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.gp::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.55) 50%,transparent 64%);background-size:260% 100%;background-position:160% 0;animation:btnsheen 5s var(--ease-io) 1.2s infinite;pointer-events:none;mix-blend-mode:overlay}
@keyframes btnsheen{0%{background-position:160% 0}45%,100%{background-position:-60% 0}}
.gn{color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 26px -14px rgba(0,0,0,.9);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.gn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.gp:active,.gn:active{transform:scale(.955);filter:brightness(1.18)}
.gp svg,.gn svg{width:18px;height:18px}
.gp.sm,.gn.sm{min-height:38px;padding:0 14px;font-size:.92rem}
.gp.block,.gn.block{width:100%}
.gp[disabled],.gn[disabled]{opacity:.4;pointer-events:none}
.danger{color:#ff8aa1}
.gn.danger{color:#ff9db0;text-shadow:0 0 12px rgba(255,60,110,.5)}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font:500 .7rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .16s var(--ease-out),background-color .2s,color .2s,border-color .2s,box-shadow .2s}
.chip svg{width:15px;height:15px}
.chip:active{transform:scale(.94)}
.chip.on{color:#fff;border-color:rgba(255,150,215,.7);background:linear-gradient(135deg,rgba(255,79,180,.42),rgba(157,92,255,.32));box-shadow:0 0 18px -2px rgba(255,79,180,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.row-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity;scroll-padding:0 16px}
.row-scroll::-webkit-scrollbar{display:none}
.row-scroll>*{scroll-snap-align:start;flex:none}

/* ---------- dock ---------- */
.dock{position:absolute;left:12px;right:12px;bottom:max(8px,calc(10px - env(safe-area-inset-bottom,0px)));z-index:20;height:64px;border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(16,10,22,.66);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 22px 50px -18px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.1)}
.dock::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.tab{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--faint);font:500 .55rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;transition:color .25s}
.tab svg{width:21px;height:21px;transition:transform .3s var(--spring),filter .3s}
.tab.on{color:#fff}
.tab.on svg{transform:translateY(-1px) scale(1.08);filter:drop-shadow(0 0 8px rgba(255,79,180,.9))}
.tab:active svg{transform:scale(.88)}
.ind{position:absolute;z-index:0;top:8px;bottom:8px;left:0;width:20%;padding:0 7px;transition:transform .5s var(--ease-drawer),opacity .3s}
.ind i{display:block;height:100%;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 24px -6px rgba(255,79,180,.55)}
.orb-tab{position:relative;z-index:2;display:grid;place-items:center;height:100%}
.orb{position:relative;width:62px;height:62px;border-radius:50%;transform:translateY(-17px);display:grid;place-items:center;transition:transform .3s var(--spring)}
.orb:active{transform:translateY(-17px) scale(.92)}
.orb .core{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;color:#fff;background:
   radial-gradient(120% 100% at 50% -25%,rgba(255,255,255,.7),rgba(255,255,255,0) 46%),
   radial-gradient(90% 120% at 0% 110%,rgba(255,46,149,.95),transparent 62%),
   radial-gradient(90% 120% at 100% -10%,rgba(110,92,255,.9),transparent 64%),
   linear-gradient(135deg,#ff4fb4,#9d5cff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -10px 18px rgba(255,46,149,.5),0 10px 26px -6px rgba(255,46,149,.8),0 0 30px -4px rgba(157,92,255,.75)}
.orb .core svg{width:23px;height:23px;filter:drop-shadow(0 0 6px rgba(255,255,255,.6))}
.orb .core b{font:400 .98rem/1 var(--f-disp);letter-spacing:.02em;text-shadow:0 0 10px rgba(255,180,230,.9)}
.orb svg.oring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.oring .t{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3.5}
.oring .p{fill:none;stroke:url(#orbGrad);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;filter:drop-shadow(0 0 4px rgba(255,79,180,.9))}
body[data-view="timer"] .orb .core{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -10px 18px rgba(255,46,149,.5),0 0 0 3px rgba(255,180,230,.35),0 10px 30px -4px rgba(255,46,149,.95),0 0 44px 0 rgba(157,92,255,.8)}

/* mini pill above dock */
.mini{position:absolute;left:50%;bottom:calc(max(8px,calc(10px - env(safe-area-inset-bottom,0px))) + 76px);z-index:19;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;gap:6px;transition:transform .45s var(--ease-drawer),opacity .3s}
.mini.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.mini button{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;font:500 .7rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;white-space:nowrap;background:rgba(20,12,28,.8);border:1px solid rgba(255,150,215,.4);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 30px -12px rgba(0,0,0,.9),0 0 20px -6px rgba(255,79,180,.6)}
.mini button b{font:400 1rem/1 var(--f-disp);letter-spacing:.03em}
.mini button svg{width:16px;height:16px}

/* ---------- home ---------- */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 0}
.hero-logo{position:relative;width:min(92%,420px)}
.hero-logo::before{content:"";position:absolute;inset:10% 6% 18%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,79,180,.42),rgba(157,92,255,.22) 55%,transparent);filter:blur(22px);animation:pulse 4.5s ease-in-out infinite}
.hero-logo img{position:relative;width:100%;height:auto;animation:float 7s ease-in-out infinite;filter:drop-shadow(0 6px 22px rgba(0,0,0,.6))}
@keyframes pulse{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.greet{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.greet h1{font:400 2.5rem/.9 var(--f-disp);text-transform:uppercase}
.greet .mono{color:var(--mute)}
.cta{display:grid;gap:10px}
.cta .gp,.cta>.gn{min-height:54px;font-size:1.18rem}
.today-cta{flex-direction:column;gap:6px;min-height:70px!important;white-space:normal;text-align:center;padding:12px 20px}
.today-cta .mono{display:inline-flex;align-items:center;gap:6px;font-size:.62rem;color:#ffe6f5;text-shadow:none}
.today-cta .mono svg{width:12px;height:12px}
.today-cta b{font:400 1.38rem/1 var(--f-disp);letter-spacing:.03em}
.rest-day{text-align:center;color:var(--pink2)}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:14px 12px 12px;border-radius:20px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font:400 2rem/1 var(--f-disp);letter-spacing:.01em}
.stat b small{font-size:.95rem;color:var(--mute);margin-left:2px}
.stat .mono{color:var(--mute);font-size:.58rem;letter-spacing:.14em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 12px;border-radius:22px}
.wd{display:flex;flex-direction:column;align-items:center;gap:8px;font:500 .62rem/1 var(--f-mono);color:var(--faint);letter-spacing:.1em}
.wd i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;transition:all .3s}
.wd i svg{width:14px;height:14px;opacity:0}
.wd.on{color:#fff}
.wd.on i{border-color:transparent;background:radial-gradient(circle at 35% 30%,#ffd6ee,#ff4fb4 45%,#9d5cff);box-shadow:0 0 16px rgba(255,79,180,.8),inset 0 1px 0 rgba(255,255,255,.7)}
.wd.on i svg{opacity:1;color:#fff}
.wd.today i{border-color:rgba(255,150,215,.8);box-shadow:0 0 0 3px rgba(255,79,180,.15)}
.ticker{overflow:hidden;margin:0 -16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker div{display:flex;width:max-content;animation:marquee 26s linear infinite}
.ticker span{font:400 1.35rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.04em;padding-right:18px;white-space:nowrap;color:transparent;-webkit-text-stroke:1px rgba(255,210,240,.55)}
.ticker span.f{color:#fff;-webkit-text-stroke:0;text-shadow:0 0 16px rgba(255,79,180,.7)}
@keyframes marquee{to{transform:translateX(-50%)}}
.wcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;text-align:left;width:100%;transition:transform .16s var(--ease-out)}
.wcard:active{transform:scale(.98)}
.wcard .wc-ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,rgba(255,79,180,.3),rgba(157,92,255,.25));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.wcard .wc-ic svg{width:22px;height:22px}
.wcard .wc-tx{flex:1;min-width:0}
.wcard b{display:block;font:400 1.3rem/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard small{display:block;color:var(--mute);font-size:.8rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard>svg{color:var(--faint);width:18px;height:18px}
.empty{padding:22px 18px;border-radius:22px;text-align:center;color:var(--mute);font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty svg{width:30px;height:30px;color:var(--pink2)}

/* ---------- routines ---------- */
.split{padding:18px 16px 16px;border-radius:26px;display:flex;flex-direction:column;gap:10px}
.split h2{font:400 2rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.split-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.sd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 2px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.sd span{font:500 .55rem/1 var(--f-mono);letter-spacing:.1em;color:var(--faint)}
.sd b{font:400 .68rem/1 var(--f-disp);letter-spacing:0;color:var(--faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd.on{background:linear-gradient(160deg,rgba(255,79,180,.22),rgba(157,92,255,.14));border-color:rgba(255,150,215,.35)}
.sd.on b{color:#fff}
.sd.td{box-shadow:0 0 0 1.5px rgba(255,180,230,.9),0 0 18px -2px rgba(255,79,180,.7)}
.sd.td span{color:var(--pink2)}
.rcard.is-today{box-shadow:0 0 0 1.5px rgba(255,150,215,.55),0 0 34px -8px rgba(255,79,180,.7),0 24px 48px -28px rgba(0,0,0,.9)}
.rc-top .eyebrow{margin-bottom:8px;display:flex}
.r-head{position:relative;display:flex;justify-content:center;margin:-6px -16px 0;padding:0 16px}
.r-head img{width:min(84%,380px);height:auto;animation:float 6s ease-in-out infinite;filter:saturate(1.1) drop-shadow(0 18px 40px rgba(255,46,149,.25))}
.rcard{padding:18px;border-radius:26px;display:flex;flex-direction:column;gap:14px}
.rc-top{display:flex;align-items:flex-start;gap:10px}
.rc-top .t{flex:1;min-width:0}
.rc-top h3{font:400 2rem/1.02 var(--f-disp);text-transform:uppercase;letter-spacing:.01em;word-break:break-word}
.rc-top .mono{color:var(--mute);margin-top:7px;display:block;letter-spacing:.1em;font-size:.64rem}
.rc-list{display:flex;flex-wrap:wrap;gap:6px}
.rc-list span{font-size:.78rem;color:var(--ink2);padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.rc-act{display:flex;gap:8px}
.rc-act .gp{flex:1}

/* ---------- timer ---------- */
.tm{display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:2px}
.tm-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:44px}
.tm-label{font:400 1.25rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.03em;color:var(--ink2);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ring-wrap{--rs:min(80vw,46vh,340px);position:relative;width:var(--rs);height:var(--rs);flex:none}
.ring-glass{position:absolute;inset:9%;border-radius:50%;background:
   radial-gradient(70% 55% at 50% 18%,rgba(255,255,255,.16),transparent 60%),
   radial-gradient(80% 80% at 30% 85%,rgba(255,46,149,.22),transparent 65%),
   radial-gradient(80% 80% at 80% 20%,rgba(110,92,255,.22),transparent 65%),
   rgba(14,8,20,.45);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -18px 40px rgba(255,46,149,.14),inset 0 0 0 1px rgba(255,190,235,.14),0 30px 60px -30px rgba(0,0,0,.9)}
svg.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:13}
.ring .tks{fill:none;stroke:rgba(255,255,255,.18);stroke-width:5;stroke-dasharray:1.2 14.2}
.ring .prog{fill:none;stroke:url(#rg);stroke-width:13;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:150px 150px;filter:drop-shadow(0 0 7px rgba(255,79,180,.85)) drop-shadow(0 0 18px rgba(157,92,255,.55))}
.ring .knob{fill:#fff;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,79,180,1))}
.ring-wrap.idle .knob{opacity:0}
.digits{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:50%}
.dg{display:flex;align-items:baseline;font:400 calc(var(--rs) * .33)/.9 var(--f-disp);color:#fff;text-shadow:0 0 18px rgba(255,120,200,.75),0 0 46px rgba(157,92,255,.5);transition:transform .25s var(--spring)}
.dg span{display:inline-block;width:.5em;text-align:center}
.dg span.c{width:.24em;transform:translateY(-.04em)}
.ends{color:var(--mute);font-size:.66rem}
.ring-wrap.idle .ends{color:var(--pink2)}
.ring-wrap.hot .dg{animation:beat 1s var(--ease-out) infinite}
.ring-wrap.hot .prog{stroke:url(#rgHot)}
.ring-wrap.paused .dg{opacity:.55;animation:blink 1.4s ease-in-out infinite}
@keyframes beat{0%{transform:scale(1.07)}35%{transform:scale(1)}}
@keyframes blink{50%{opacity:.25}}
.tm-ctrl{display:flex;align-items:center;justify-content:center;gap:18px}
.circ{width:54px;height:54px;min-height:0;padding:0;border-radius:50%;font-size:1.02rem}
.big-orb{width:80px;height:80px;min-height:0;padding:0;border-radius:50%;flex-direction:column;gap:3px;font-size:.88rem}
.big-orb svg{width:26px;height:26px}
.tm-sub{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.presets{width:100%}
.presets .chip{height:38px;font:400 1rem/1 var(--f-disp);letter-spacing:.04em;padding:0 14px}
.tm-status{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;color:var(--mute);font:500 .62rem/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;max-width:360px}
.tm-status span{display:inline-flex;align-items:center;gap:6px}
.tm-status svg{width:14px;height:14px}
.tm-status .ok{color:var(--ok)}
.tm-status .warn{color:#ffc27a}
.tap-sound{display:none;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:rgba(255,194,122,.12);border:1px solid rgba(255,194,122,.4);color:#ffd9a8;font-size:.85rem}
.tap-sound.on{display:inline-flex}

/* ---------- progress ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:16px;border-radius:22px;display:flex;flex-direction:column;gap:6px}
.kpi b{font:400 2.4rem/.95 var(--f-disp)}
.kpi b small{font-size:1rem;color:var(--mute);margin-left:3px}
.kpi .mono{color:var(--mute);font-size:.6rem}
.heat{padding:16px;border-radius:22px;display:flex;flex-direction:column;gap:10px}
.heat-g{display:grid;grid-template-columns:repeat(16,1fr);grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:4px}
.heat-g i{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.06)}
.heat-g i.l1{background:rgba(255,79,180,.45);box-shadow:0 0 8px rgba(255,79,180,.45)}
.heat-g i.l2{background:rgba(255,79,180,.75);box-shadow:0 0 10px rgba(255,79,180,.6)}
.heat-g i.l3{background:linear-gradient(135deg,#ff8fd2,#ff4fb4 50%,#9d5cff);box-shadow:0 0 12px rgba(255,79,180,.9)}
.heat-g i.td{outline:1.5px solid rgba(255,255,255,.7);outline-offset:1px}
.heat-g i.fu{opacity:.25}
.heat-l{display:flex;justify-content:space-between;color:var(--faint);font:500 .58rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;text-align:left;width:100%;transition:transform .16s var(--ease-out)}
.li:active{transform:scale(.985)}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;color:var(--mute);font-size:.8rem;margin-top:2px}
.li .v{font:400 1.45rem/1 var(--f-disp);text-align:right;white-space:nowrap}
.li .v small{font:500 .58rem/1.2 var(--f-mono);letter-spacing:.12em;color:var(--mute);margin-top:4px}
.li>svg{width:16px;height:16px;color:var(--faint)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font:500 .58rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,rgba(255,79,180,.6),rgba(157,92,255,.5));box-shadow:0 0 12px -2px rgba(255,79,180,.7)}
.badge svg{width:11px;height:11px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);gap:4px}
.seg button{flex:1;height:34px;border-radius:999px;font:500 .66rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);transition:all .25s var(--ease-out);white-space:nowrap;padding:0 8px}
.seg button.on{color:#fff;background:linear-gradient(135deg,rgba(255,79,180,.55),rgba(157,92,255,.45));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 16px -4px rgba(255,79,180,.8)}

/* ---------- settings ---------- */
.set-g{border-radius:22px;padding:4px 16px}
.set-r{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-r:last-child{border-bottom:0}
.set-r .tx{flex:1;min-width:0}
.set-r b{display:block;font-weight:600;font-size:.95rem}
.set-r small{display:block;color:var(--mute);font-size:.78rem;margin-top:2px;line-height:1.35}
.set-r.col{flex-direction:column;align-items:stretch;gap:10px}
.tg{position:relative;width:52px;height:32px;flex:none;display:inline-block}
.tg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.tg span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line2);transition:all .3s var(--ease-out)}
.tg span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .35s var(--spring)}
.tg input:checked+span{background:linear-gradient(135deg,#ff4fb4,#9d5cff);border-color:transparent;box-shadow:0 0 16px -2px rgba(255,79,180,.85)}
.tg input:checked+span::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line2);font-size:1.2rem;line-height:1}
.stepper button:active{transform:scale(.9)}
.stepper output{min-width:44px;text-align:center;font:400 1.35rem/1 var(--f-disp)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#ff4fb4,#9d5cff var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-10px;background:#fff;box-shadow:0 0 0 4px rgba(255,79,180,.35),0 0 16px rgba(255,79,180,.8)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.12)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:linear-gradient(90deg,#ff4fb4,#9d5cff)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 16px rgba(255,79,180,.8)}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg-op{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line2);transition:transform .2s var(--ease-out),box-shadow .3s,border-color .3s}
.bg-op img{width:100%;height:100%;object-fit:contain}
.bg-op.cv img{object-fit:cover}
.bg-op.lg img{object-fit:contain;padding:10%}
.bg-op span{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 7px;font:500 .52rem/1.15 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.bg-op.on{border-color:rgba(255,150,215,.95);box-shadow:0 0 0 2px rgba(255,79,180,.5),0 0 22px rgba(255,79,180,.55)}
.bg-op:active{transform:scale(.95)}
.bg-op .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.65);border:1px solid var(--line2);z-index:2}
.bg-op .rm svg{width:12px;height:12px}
.bg-op.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--pink2);background:rgba(255,79,180,.06);border-style:dashed}
.bg-op.add span{position:static;background:none;padding:0;color:var(--ink2)}
.bg-black{width:100%;height:100%;background:radial-gradient(60% 40% at 20% 90%,rgba(255,46,149,.35),transparent),radial-gradient(60% 40% at 90% 10%,rgba(122,92,255,.35),transparent),#000}
.field{-webkit-appearance:none;appearance:none;width:100%;height:50px;border-radius:16px;padding:0 14px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-size:16px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:rgba(255,150,215,.8);box-shadow:0 0 0 4px rgba(255,79,180,.16)}
textarea.field{height:120px;padding:12px 14px;resize:none;font:400 16px/1.35 var(--f-mono)}
.foot{text-align:center;color:var(--faint);padding:10px 0 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.foot img{width:150px;opacity:.85}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:st;padding:4px 0}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:var(--ink2)}
.steps li::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:400 .95rem/1 var(--f-disp);background:linear-gradient(135deg,#ff4fb4,#9d5cff);color:#fff;box-shadow:0 0 12px rgba(255,79,180,.6)}
.steps{margin:0;padding:0}

/* ---------- workout layer ---------- */
.wk{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:rgba(3,1,6,.86);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);transform:translate3d(0,104%,0);transition:transform .55s var(--ease-drawer);visibility:hidden}
.wk.open{transform:none;visibility:visible}
.wk.closing{visibility:visible}
.wk::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 30% at 0% 100%,rgba(255,46,149,.16),transparent 70%),radial-gradient(60% 30% at 100% 0%,rgba(122,92,255,.16),transparent 70%)}
.wk-h{position:relative;flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.wk-h .tx{flex:1;min-width:0;text-align:center}
.wk-h h2{font:400 1.5rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-h .mono{color:var(--pink2);margin-top:4px;display:block}
.wk-stats{position:relative;flex:none;display:grid;grid-template-columns:repeat(3,1fr);margin:0 14px 6px;border-radius:18px;padding:10px 4px}
.wk-stats div{display:flex;flex-direction:column;align-items:center;gap:4px}
.wk-stats b{font:400 1.35rem/1 var(--f-disp)}
.wk-stats .mono{font-size:.55rem;color:var(--mute)}
.wk-b{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 12px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.exc{border-radius:24px;padding:14px 12px 10px}
.exc-h{display:flex;align-items:flex-start;gap:8px;padding:0 4px 10px}
.exc-h .tx{flex:1;min-width:0}
.exc-h h3{font:400 1.45rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.exc-h .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.exc-h .meta .mono{color:var(--mute);font-size:.58rem}
.rest-p{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font:500 .62rem/1 var(--f-mono);letter-spacing:.1em;color:var(--pink2);background:rgba(255,79,180,.1);border:1px solid rgba(255,79,180,.35)}
.rest-p svg{width:12px;height:12px}
.sets-h,.set-in{display:grid;grid-template-columns:38px minmax(0,1fr) 74px 64px 46px;gap:6px;align-items:center}
.sets-h{padding:0 2px 6px;font:500 .55rem/1 var(--f-mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.sets-h span{text-align:center}
.sets-h span:nth-child(2){text-align:left;padding-left:4px}
.set{position:relative;border-radius:14px;overflow:hidden;margin-bottom:5px;touch-action:pan-y}
.set .del{position:absolute;top:0;right:0;bottom:0;width:84px;display:grid;place-items:center;background:linear-gradient(135deg,#ff2e6e,#c0185a);color:#fff;font:400 1rem/1 var(--f-disp);letter-spacing:.06em;border-radius:14px}
.set-in{position:relative;z-index:1;padding:5px 2px;background:#0d0912;border-radius:14px;transition:transform .35s var(--ease-drawer),background-color .3s}
.set.sw .set-in{transform:translateX(-90px)}
.set.drag .set-in{transition:none}
.set-n{height:34px;border-radius:11px;display:grid;place-items:center;font:400 1.05rem/1 var(--f-disp);color:var(--ink2);background:rgba(255,255,255,.06)}
.set-n.t-w{color:#ffd27a;background:rgba(255,194,122,.12)}
.set-n.t-d{color:#8fd0ff;background:rgba(93,139,255,.16)}
.prev{font:500 .72rem/1.2 var(--f-mono);color:var(--faint);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{-webkit-appearance:none;appearance:none;width:100%;height:40px;border-radius:12px;text-align:center;font:400 1.2rem/1 var(--f-disp);letter-spacing:.02em;background:rgba(255,255,255,.07);border:1px solid transparent;color:#fff;padding:0 4px;transition:border-color .2s,box-shadow .2s,background-color .2s}
.inp::placeholder{color:rgba(255,255,255,.3)}
.inp:focus{border-color:rgba(255,150,215,.85);box-shadow:0 0 0 3px rgba(255,79,180,.18);background:rgba(255,79,180,.08)}
.inp:disabled{opacity:.25}
.chk{height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--faint);transition:all .3s var(--ease-out)}
.chk svg{width:20px;height:20px}
.chk:active{transform:scale(.88)}
.set.done .set-in{background:linear-gradient(90deg,rgba(255,79,180,.22),rgba(157,92,255,.15)),#0d0912}
.prev .badge{padding:3px 7px}
.set.done .chk{color:#fff;background:linear-gradient(135deg,#ff4fb4,#9d5cff);box-shadow:0 0 16px rgba(255,79,180,.75),inset 0 1px 0 rgba(255,255,255,.6)}
.set.done .inp{background:transparent;color:#fff}
.set.pop .chk{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.set .prb{position:absolute;z-index:2;top:-3px;left:30px;pointer-events:none}
.exc-f{display:flex;gap:8px;padding:6px 2px 2px}
.exc-f .chip{flex:1;height:34px}
.wk-end{display:flex;flex-direction:column;gap:10px;padding:6px 2px 0}
.restbar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:24px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:10px;overflow:hidden;background:rgba(22,12,30,.82);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:0 20px 50px -16px rgba(0,0,0,.95),0 0 30px -10px rgba(255,79,180,.6);transform:translateY(140%);transition:transform .5s var(--ease-drawer)}
.restbar.on{transform:none}
.restbar::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge-pink);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.restbar .fill{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,79,180,.32),rgba(157,92,255,.24));pointer-events:none}
.restbar .tx{position:relative;flex:1;min-width:0;text-align:left;color:#fff}
.restbar .tx .mono{color:var(--pink2);font-size:.56rem}
.restbar .tx b{display:block;font:400 2rem/1 var(--f-disp);letter-spacing:.02em;margin-top:2px;text-shadow:0 0 14px rgba(255,79,180,.7)}
.restbar button{position:relative}
.restbar .circ{width:42px;height:42px;font-size:.9rem}

/* ---------- sheets / modal / toast ---------- */
.layer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s ease}
.layer.open .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:520px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;border-radius:30px 30px 0 0;background:linear-gradient(180deg,rgba(30,18,40,.92),rgba(10,6,14,.96));-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);box-shadow:0 -30px 80px -30px rgba(0,0,0,.9),0 -10px 50px -30px rgba(255,79,180,.5);transform:translate3d(0,105%,0);transition:transform .5s var(--ease-drawer);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px 1px 0;background:var(--edge-pink);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;opacity:.6}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 14px)}
.layer.open .sheet{transform:none}
.layer.drag .sheet{transition:none}
.grab{flex:none;display:grid;place-items:center;height:22px;touch-action:none}
.grab i{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.28)}
.sheet-h{flex:none;display:flex;align-items:center;gap:10px;padding:0 16px 10px 20px;touch-action:none}
.sheet-h h3{flex:1;font:400 1.75rem/1 var(--f-disp);text-transform:uppercase;letter-spacing:.01em;min-width:0}
.sheet-b{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px 22px;display:flex;flex-direction:column;gap:14px}
.sheet-b>*,.wk-b>*{flex-shrink:0}
.sheet-f{flex:none;display:flex;gap:10px;padding:10px 18px 14px}
.sheet-f>*{flex:1}
.modal{position:relative;width:min(88vw,360px);margin:auto;border-radius:28px;padding:24px 20px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;background:linear-gradient(180deg,rgba(34,20,46,.95),rgba(12,8,18,.97));-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 40px 90px -30px rgba(0,0,0,.95),0 0 60px -30px rgba(255,79,180,.6);transform:scale(.9);opacity:0;transition:transform .4s var(--spring),opacity .25s}
.layer.mid{align-items:center}
.layer.open .modal{transform:none;opacity:1}
.modal h3{font:400 1.9rem/.95 var(--f-disp);text-transform:uppercase}
.modal p{color:var(--ink2);font-size:.92rem}
.modal .btns{display:flex;gap:8px;margin-top:6px}
.modal .btns>*{flex:1}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;max-width:420px;padding:12px 16px;border-radius:18px;font-size:.9rem;color:#fff;background:rgba(24,14,32,.9);border:1px solid rgba(255,150,215,.4);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 16px 40px -14px rgba(0,0,0,.9),0 0 24px -8px rgba(255,79,180,.7);animation:tin .5s var(--spring) both}
.toast svg{width:18px;height:18px;color:var(--pink2);flex:none}
.toast.out{animation:tout .3s ease-in both}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.95)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px) scale(.97)}}

/* time picker wheels */
.wheels{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:220px;margin:4px 0}
.wheel{width:96px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask:linear-gradient(transparent,#000 32%,#000 68%,transparent);position:relative;z-index:1;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:88px}
.wheel .it{height:44px;display:grid;place-items:center;scroll-snap-align:center;font:400 2.1rem/1 var(--f-disp);color:rgba(255,255,255,.32);transition:color .15s,transform .2s,text-shadow .2s}
.wheel .it.on{color:#fff;transform:scale(1.12);text-shadow:0 0 14px rgba(255,79,180,.9)}
.wheels .colon{font:400 2.2rem/1 var(--f-disp);color:#fff;position:relative;z-index:1;margin-top:-4px}
.wheels .hi{position:absolute;left:50%;top:50%;width:250px;height:50px;transform:translate(-50%,-50%);border-radius:16px;background:linear-gradient(135deg,rgba(255,79,180,.22),rgba(157,92,255,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 26px -6px rgba(255,79,180,.7);pointer-events:none}
.wheels .lbl{position:absolute;top:50%;transform:translateY(-50%);font:500 .55rem/1 var(--f-mono);letter-spacing:.14em;color:var(--pink2);z-index:2;pointer-events:none}
.wheels .lbl.m{left:calc(50% - 119px)}
.wheels .lbl.s{left:calc(50% + 89px)}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* exercise picker */
.searchbox{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line2)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;color:#fff;-webkit-appearance:none;appearance:none}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox svg{color:var(--mute);width:18px;height:18px}
.exl{display:flex;flex-direction:column;gap:2px}
.exl h4{font:500 .62rem/1 var(--f-mono);letter-spacing:.18em;color:var(--pink2);padding:14px 4px 6px;text-transform:uppercase}
.exi{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 10px;border-radius:14px;text-align:left;transition:background-color .2s}
.exi:active{background:rgba(255,255,255,.05)}
.exi .tx{flex:1;min-width:0}
.exi b{display:block;font-weight:500;font-size:.95rem}
.exi small{display:block;color:var(--faint);font-size:.72rem}
.exi i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .25s var(--spring)}
.exi i svg{width:14px;height:14px;opacity:0}
.exi.on i{border-color:transparent;background:linear-gradient(135deg,#ff4fb4,#9d5cff);box-shadow:0 0 12px rgba(255,79,180,.8);transform:scale(1.08)}
.exi.on i svg{opacity:1}

/* routine editor rows */
.rx{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.rx-h{display:flex;align-items:center;gap:8px}
.rx-h b{flex:1;min-width:0;font:400 1.2rem/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.01em}
.rx-h button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.rx-h button svg{width:16px;height:16px}
.rx-g{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rx-g .lab{display:flex;flex-direction:column;gap:6px;min-width:0}
.rx-g .lab .mono{font-size:.55rem;color:var(--mute)}
.rx-g .field{height:38px;border-radius:12px;font:400 1.05rem/1 var(--f-disp);text-align:center;padding:0 6px}
.rx-g .rest-p{height:38px;border-radius:12px;font-size:.72rem}
.rx-g .stepper button{width:32px;height:38px}
.rx-g .stepper output{min-width:30px}

/* summary */
.sum{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.sum h2{font:400 3rem/.9 var(--f-disp);text-transform:uppercase}
.sum-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:10px}
.sum-k div{padding:14px 6px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.sum-k b{font:400 1.7rem/1 var(--f-disp)}
.sum-k .mono{font-size:.55rem;color:var(--mute)}
.detail-ex{padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.detail-ex b{font:400 1.15rem/1.1 var(--f-disp);text-transform:uppercase}
.detail-ex ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.detail-ex li{display:flex;gap:10px;font:500 .8rem/1.3 var(--f-mono);color:var(--ink2)}
.detail-ex li span{color:var(--faint);width:22px}

/* ---------- flash (rest done) ---------- */
.flash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;overflow:hidden}
.flash.on{opacity:1;visibility:visible;transition:opacity .25s ease}
.flash::before{content:"";position:absolute;inset:0;background:rgba(4,0,8,.72);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.flash .burst{position:absolute;left:50%;top:46%;width:160vmax;height:160vmax;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(closest-side,rgba(255,120,210,.85),rgba(255,46,149,.5) 30%,rgba(157,92,255,.28) 55%,transparent 72%);opacity:0}
.flash.on .burst{animation:burst 1.6s var(--ease-out) both,breathe 1.2s ease-in-out 1.6s infinite}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.05);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:.55}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:.3}}
.flash-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.flash-t{font:400 clamp(4.6rem,24vw,8rem)/.9 var(--f-disp);text-transform:uppercase;letter-spacing:.005em;text-shadow:0 0 30px rgba(255,79,180,.6)}
.flash.on .flash-t{animation:slam .7s var(--spring) both}
@keyframes slam{0%{transform:scale(1.6);opacity:0;filter:blur(10px)}100%{transform:none;opacity:1;filter:none}}
.flash-sub{color:var(--ink2);font-size:1rem;max-width:300px}
.flash-late{color:#ffd9a8}
.flash-btns{display:flex;gap:10px;margin-top:14px}
.flash-btns .gp{min-width:140px;min-height:54px;font-size:1.15rem}
.flash-btns .gn{min-height:54px}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s ease,visibility 0s linear .6s}
.intro.gone{opacity:0;visibility:hidden}
.intro .lg{position:relative;width:min(80vw,440px)}
.intro .lg::before{content:"";position:absolute;inset:-10% -5%;background:radial-gradient(closest-side,rgba(255,79,180,.55),rgba(157,92,255,.3) 50%,transparent);filter:blur(30px);opacity:0;animation:ilg 1.2s .25s var(--ease-out) forwards}
.intro .lg img{position:relative;width:100%;clip-path:inset(0 0 100% 0);animation:drip 1.15s .1s var(--ease-out) forwards}
.intro .mono{color:var(--mute);opacity:0;animation:fadein .6s .7s forwards}
.intro .bar{width:120px;height:2px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.intro .bar i{display:block;height:100%;width:100%;background:var(--grad);transform:scaleX(0);transform-origin:0 50%;animation:load 1.3s .15s var(--ease-io) forwards}
@keyframes drip{to{clip-path:inset(0 0 0 0)}}
@keyframes ilg{to{opacity:1}}
@keyframes fadein{to{opacity:1}}
@keyframes load{to{transform:scaleX(1)}}

/* ---------- RANKED ---------- */
.bdg{display:block;overflow:visible;flex:none}
.bdg .aura{transform-origin:50px 48px;animation:bAura 3.2s ease-in-out infinite}
.bdg .rays{transform-origin:50px 48px;animation:bSpin 26s linear infinite}
.bdg .star{transform-origin:50px 47px;animation:bSpin 48s linear infinite reverse}
.bdg .shine{animation:bShine 4.6s cubic-bezier(.6,0,.2,1) infinite}
.bdg .tw path{transform-box:fill-box;transform-origin:50% 50%;animation:bTw 2.6s ease-in-out infinite}
.bdg .tw .tw2{animation-delay:1.3s}
@keyframes bAura{0%,100%{opacity:.7;transform:scale(.93)}50%{opacity:1;transform:scale(1.05)}}
@keyframes bSpin{to{transform:rotate(360deg)}}
@keyframes bShine{0%{transform:translateX(0)}55%,100%{transform:translateX(170px)}}
@keyframes bTw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.bdg.xl{width:156px;height:156px}
.bdg.lg{width:118px;height:118px}
.tiertx{background:linear-gradient(180deg,#fff 0%,#fff 18%,var(--t1) 40%,var(--tg) 58%,#fff 63%,var(--t1) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:.16em 0 .06em;margin:-.16em 0 -.06em}
.rk-k b{font-size:1.2rem;line-height:1.05}
.rk-glow{position:absolute;left:50%;top:-40px;width:320px;height:280px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--tg),transparent);opacity:.26;pointer-events:none}
.rk-hero{padding:16px 18px 16px;border-radius:28px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;overflow:hidden}
.rk-hero>*:not(.rk-glow){position:relative}
.rk-hero .bdg.xl{margin:-2px 0 -6px}
.rk-name{font:400 2.5rem/1 var(--f-disp);letter-spacing:.02em;text-transform:uppercase}
.rk-top{display:flex;flex-direction:column;align-items:center;gap:5px}
.rk-top b{font:400 1.5rem/1 var(--f-disp);letter-spacing:.04em;color:#fff}
.rk-top .mono{color:var(--mute);font-size:.56rem}
.rk-bar{position:relative;width:100%;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.rk-bar i{position:absolute;inset:0;border-radius:8px;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--t2),var(--tg) 70%,#fff);box-shadow:0 0 14px var(--tg)}
.view.in .rk-bar i,.layer.open .rk-bar i{animation:rkBar 1.1s var(--ease-out) .3s both}
@keyframes rkBar{from{transform:scaleX(0)}}
.rk-bar-l{width:100%;display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:.55rem}
.rk-bw{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font:500 .58rem/1 var(--f-mono);letter-spacing:.12em;color:var(--ink2)}
.rk-bw svg{width:14px;height:14px}
.rk-hint{color:var(--ink2);font-size:.9rem;max-width:330px}
.rk-bwin{display:flex;align-items:center;gap:8px;width:100%}
.rk-bwin .field{flex:1;text-align:center;font:400 1.35rem/1 var(--f-disp);letter-spacing:.03em}
.rk-bwin .mono{color:var(--mute)}
.rk-map{padding:16px 10px 14px;border-radius:26px;display:flex;flex-direction:column;gap:10px}
.rk-map .sec-h{padding:0 6px}
.rk-figs{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.rk-figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.rk-figs figcaption{color:var(--faint);font-size:.55rem}
svg.body{width:100%;max-width:178px;height:auto;overflow:visible;filter:drop-shadow(0 0 12px rgba(255,79,180,.2))}
.body .sil path{fill:#171120;stroke:rgba(255,255,255,.10);stroke-width:1}
.body .mu path{stroke:rgba(8,4,12,.9);stroke-width:1.1;stroke-linejoin:round}
.body .mu.on path{stroke:rgba(255,255,255,.35);stroke-width:.8}
.body .mu{cursor:pointer;transition:opacity .2s}
.body .mu:active{opacity:.7}
.body .mu.sel path{stroke:#fff;stroke-width:2}
.view.in .body .mu{animation:muIn .7s var(--ease-out) both;animation-delay:calc(var(--i) * 40ms + 250ms)}
@keyframes muIn{from{opacity:0}}
.body .bshine{animation:bodyShine 6.5s cubic-bezier(.6,0,.3,1) 1.4s infinite}
@keyframes bodyShine{0%{transform:translateX(0)}45%,100%{transform:translateX(430px)}}
.rk-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;padding:0 6px}
.rk-leg span{display:inline-flex;align-items:center;gap:6px;font:500 .55rem/1 var(--f-mono);letter-spacing:.12em;color:var(--ink2)}
.rk-leg i{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:var(--c);box-shadow:0 0 8px var(--g)}
.rk-leg .off{color:var(--faint)}
.rk-leg .off i{background:#3c3248;box-shadow:none}
.rk-sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rk-sw button{padding:14px;border-radius:20px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;transition:transform .16s var(--ease-out)}
.rk-sw button:active{transform:scale(.97)}
.rk-sw .mono{display:inline-flex;align-items:center;gap:5px;color:var(--mute);font-size:.55rem}
.rk-sw .mono svg{width:12px;height:12px;color:var(--tg)}
.rk-sw b{font:400 1.35rem/1 var(--f-disp);text-transform:uppercase}
.rk-sw small{font:400 1rem/1 var(--f-disp);letter-spacing:.03em}
.rk-row{gap:12px;padding:9px 14px 9px 9px}
.rk-row .bdg{width:46px;height:46px}
.rk-row .tx b{font:400 1.2rem/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.02em}
.rk-row .tx small{font:500 .58rem/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rk-row .rk-bar{height:5px;margin-top:7px}
.rk-row.ex .tx b{font:600 .9rem/1.2 var(--f-body);text-transform:none;letter-spacing:0}
.rk-row.ex .tx small{font:400 .74rem/1.3 var(--f-body);letter-spacing:0;text-transform:none}
.li .rk-v{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font:inherit}
.rk-v span{font:400 1rem/1 var(--f-disp);letter-spacing:.03em}
.li .rk-v small{font:500 .52rem/1 var(--f-mono);letter-spacing:.1em;color:var(--mute);margin:0}
.rk-act{display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.rk-home .tx small{margin:0 0 5px}
.rk-home .tx b{font-size:1.45rem}
.rk-home .rk-v span{font-size:1.1rem}
.rk-src{color:var(--faint);font-size:.72rem;line-height:1.45;text-align:center;padding:0 6px}
.rk-det{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:2px}
.rk-det>*:not(.rk-glow){position:relative}
.rk-det .rk-glow{top:-50px}
.rk-det-r{display:flex;gap:12px;align-items:baseline;justify-content:center;flex-wrap:wrap;font:500 .62rem/1.2 var(--f-mono);letter-spacing:.12em;color:var(--mute)}
.rk-det-r b{font:400 1.3rem/1 var(--f-disp);letter-spacing:.03em}
.rk-det .rk-bar{max-width:280px}
.rk-need{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px}
.rk-need .bdg{width:46px;height:46px}
.rk-need .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rk-need .mono{color:var(--tg);font-size:.56rem}
.rk-need b{font:400 1.45rem/1 var(--f-disp);letter-spacing:.02em}
.rk-need small{color:var(--mute);font-size:.76rem}
.rk-lad{border-radius:20px;padding:6px;display:flex;flex-direction:column;gap:2px}
.rk-lad-row{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:14px}
.rk-lad-row .bdg{width:36px;height:36px}
.rk-lad-row>b{flex:1;font:400 1.08rem/1 var(--f-disp);letter-spacing:.03em}
.rk-lad-row>span{font:400 1.08rem/1 var(--f-disp);color:#fff;white-space:nowrap}
.rk-lad-row.on{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--tg),0 0 18px -6px var(--tg)}
.rk-lad-row.big .bdg{width:52px;height:52px}
.rk-lad-row.big .tx{flex:1;min-width:0}
.rk-lad-row.big .tx b{display:block;font:400 1.3rem/1 var(--f-disp);letter-spacing:.03em}
.rk-lad-row.big small{display:block;font:500 .54rem/1.45 var(--f-mono);letter-spacing:.06em;color:var(--mute);margin-top:4px}
.rk-pick{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;text-align:left;width:100%}
.rk-pick .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.rk-pick .mono{color:var(--pink2);font-size:.55rem}
.rk-pick b{font:400 1.3rem/1.05 var(--f-disp);text-transform:uppercase;letter-spacing:.02em}
.rk-pick>svg{width:18px;height:18px;color:var(--mute)}
.rk-cin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rk-cin label{display:flex;flex-direction:column;gap:6px}
.rk-cin .mono{color:var(--mute);font-size:.55rem}
.rk-cin .field{text-align:center;font:400 1.6rem/1 var(--f-disp);height:56px;letter-spacing:.03em}
.rk-cout{display:flex;flex-direction:column;gap:12px}
/* subida de rango */
.rkup{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;overflow:hidden}
.rkup.on{opacity:1;visibility:visible;transition:opacity .25s ease}
.rkup::before{content:"";position:absolute;inset:0;background:rgba(4,0,8,.86);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
.rkup-rays{position:absolute;left:50%;top:38%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,var(--tg) 0deg 3deg,transparent 3deg 15deg);-webkit-mask:radial-gradient(closest-side,rgba(0,0,0,.6),transparent 72%);mask:radial-gradient(closest-side,rgba(0,0,0,.6),transparent 72%);opacity:0}
.rkup.on .rkup-rays{animation:rkFadeR 1s ease-out 1s both,bSpin 50s linear infinite}
@keyframes rkFadeR{from{opacity:0}to{opacity:.32}}
.rkup-burst{position:absolute;left:50%;top:38%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;background:radial-gradient(closest-side,var(--tg),transparent 70%);opacity:0;transform:scale(.05)}
.rkup.on .rkup-burst{animation:rkBurst 1.6s var(--ease-out) 1s both}
@keyframes rkBurst{0%{opacity:.95;transform:scale(.05)}100%{opacity:.26;transform:scale(1)}}
.rkup-white{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.rkup.on .rkup-white{animation:rkWhite .7s ease-out .95s both}
@keyframes rkWhite{0%{opacity:0}18%{opacity:.7}100%{opacity:0}}
.rkup-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;width:100%;max-width:380px}
.rkup-stage{position:relative;width:210px;height:210px}
.rkup-stage .old,.rkup-stage .new{position:absolute;inset:0}
.rkup-stage .bdg{width:100%;height:100%}
.rkup.on .old{animation:rkOld 1.05s var(--ease-io) both}
@keyframes rkOld{0%{transform:scale(.5);opacity:0}25%{transform:scale(1);opacity:1}72%{transform:scale(1.05);opacity:1;filter:none}100%{transform:scale(.3) rotate(-25deg);opacity:0;filter:brightness(3) blur(6px)}}
.rkup.on .new{animation:rkNew .95s var(--spring) 1s both}
@keyframes rkNew{0%{transform:scale(2.3);opacity:0;filter:blur(16px) brightness(2.5)}100%{transform:none;opacity:1;filter:none}}
.rkup-stage .ring{position:absolute;left:50%;top:46%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--tg);box-shadow:0 0 30px var(--tg),inset 0 0 20px var(--tg);opacity:0}
.rkup.on .ring{animation:rkRing 1.1s var(--ease-out) 1.02s both}
@keyframes rkRing{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(5.5)}}
.rkup-k,.rkup-n,.rkup-l,.rkup-from,.rkup-list,.rkup-b{opacity:0}
.rkup.on .rkup-k{animation:rise .6s var(--ease-out) .12s both}
.rkup.on .rkup-n{animation:slam .7s var(--spring) 1.25s both}
.rkup.on .rkup-l{animation:rise .6s var(--ease-out) 1.45s both}
.rkup.on .rkup-from{animation:rise .6s var(--ease-out) 1.55s both}
.rkup.on .rkup-list{animation:rise .6s var(--ease-out) 1.7s both}
.rkup.on .rkup-b{animation:rise .6s var(--ease-out) 1.85s both}
.rkup.first.on .rkup-burst,.rkup.first.on .new{animation-delay:.25s}
.rkup.first.on .rkup-rays{animation-delay:.25s,0s}
.rkup.first.on .rkup-white{animation-delay:.2s}
.rkup.first.on .ring{animation-delay:.27s}
.rkup.first.on .rkup-n{animation-delay:.5s}
.rkup.first.on .rkup-l{animation-delay:.7s}
.rkup.first.on .rkup-list{animation-delay:.95s}
.rkup.first.on .rkup-b{animation-delay:1.1s}
.rkup-n{font-size:3.3rem}
.rkup.big .rkup-n{font-size:3.8rem}
.rkup-l{color:var(--ink2)}
.rkup-from{color:var(--mute);font-size:.62rem}
.rkup-list{display:flex;flex-direction:column;gap:6px;width:100%}
.rkup-list span{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.rkup-list .bdg{width:32px;height:32px}
.rkup-list b{flex:1;text-align:left;font:400 1.05rem/1 var(--f-disp)}
.rkup-list i{font:400 1.05rem/1 var(--f-disp);font-style:normal}

/* ---------- wide screens ---------- */
@media (min-width:700px){
  .app{border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(0,0,0,.25)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* iOS home-screen: force full screen height (no black strip at the bottom) */
html.sa{height:var(--fullh)!important;min-height:var(--fullh)}
html.sa body{height:100%}

        <div class="wheel" data-w="m"><div class="pad"></div>${mins.map(i => `<div class="it">${i}</div>`).join('')}<div class="pad"></div></div>

        <div class="wheel" data-w="s"><div class="pad"></div>${secs.map(i => `<div class="it">${pad(i)}</div>`).join('')}<div class="pad"></div></div>

      foot: `${fav ? `<button class="gn" data-k="fav">${I.spark} FAVORITO</button>` : ''}<button class="gp" data-k="ok">${I.check} LISTO</button>`,

    });
    const wm = sh.el.querySelector('[data-w="m"]'), wsx = sh.el.querySelector('[data-w="s"]'), IT = 44;
    const setW = (w, idx, smooth) => { try { w.scrollTo({ top: idx * IT, behavior: smooth ? 'smooth' : 'auto' }); } catch (e) { w.scrollTop = idx * IT; } };
    const read = w => clamp(Math.round(w.scrollTop / IT), 0, w.querySelectorAll('.it').length - 1);
    const mark = w => { const i = read(w); w.querySelectorAll('.it').forEach((el, j) => el.classList.toggle('on', j === i)); };
    requestAnimationFrame(() => { setW(wm, m); setW(wsx, s / 5); mark(wm); mark(wsx); });
    [wm, wsx].forEach(w => {
      w.addEventListener('scroll', () => mark(w), { passive: true });
      w.addEventListener('click', e => { const it = e.target.closest('.it'); if (it) setW(w, Array.from(w.querySelectorAll('.it')).indexOf(it), true); });
    });
    const val = () => clamp(read(wm) * 60 + read(wsx) * 5, 5, 1200);
    sh.el.addEventListener('click', e => {
      const q = e.target.closest('[data-q]'); if (q) { const v = +q.dataset.q; setW(wm, Math.floor(v / 60), true); setW(wsx, (v % 60) / 5, true); return; }
      const k = e.target.closest('[data-k]'); if (!k) return;

      }
    });
  });
}

function pickExercises({ title = 'EJERCICIOS', multi = true, filter = null, noCreate = false } = {}) {
  return new Promise(res => {
    const sel = []; let q = '', mf = '', done = false;
    const sh = sheet({
      title, full: true,
      body: `<div class="searchbox">${I.search}<input id="exq" type="search" placeholder="Buscar ejercicio" autocomplete="off" autocorrect="off" enterkeyhint="search"></div>
        <div class="row-scroll" id="exm" style="margin:0 -18px;padding:2px 18px 4px"></div><div class="exl" id="exl"></div>`,
      foot: `${noCreate ? '' : `<button class="gn" data-x="new">${I.plus} CREAR</button>`}${multi || !noCreate ? `<button class="gp" data-x="ok" id="exOk">${multi ? 'AGREGAR' : 'ELEGIR'}</button>` : `<button class="gn" data-close id="exOk">CERRAR</button>`}`,
      onClose: () => res(done ? sel.slice() : null),
    });
    const box = sh.el, list = box.querySelector('#exl'), chips = box.querySelector('#exm'), okB = box.querySelector('#exOk');
    const drawChips = () => { chips.innerHTML = ['', ...MUSCLES.filter(m => !filter || allEx().some(e => e.m === m && filter(e.id)))].map(m => `<button class="chip ${m === mf ? 'on' : ''}" data-m="${esc(m)}">${m || 'TODOS'}</button>`).join(''); };
    const draw = () => {
      const nq = norm(q);
      const items = allEx().filter(e => (!filter || filter(e.id)) && (!mf || e.m === mf) && (!nq || norm(e.n).includes(nq) || norm(e.m).includes(nq)));
      const groups = {}; items.forEach(e => { (groups[e.m] = groups[e.m] || []).push(e); });
      const order = [...MUSCLES, 'OTRO'].filter(m => groups[m]);
      list.innerHTML = order.length ? order.map(m => `<h4>${m}</h4>${groups[m].map(e => `<button class="exi ${sel.includes(e.id) ? 'on' : ''}" data-id="${esc(e.id)}"><div class="tx"><b>${esc(e.n)}</b><small>${e.k === 'bw' ? 'PESO CORPORAL' : e.k === 'min' ? 'MINUTOS' : e.k === 'sec' ? 'SEGUNDOS' : 'PESO × REPS'}${S.custom.includes(e) ? ' · TUYO' : ''}${unitHint(e.id) === ' C/U' ? ' · PESO DE UNA MANCUERNA' : ''}</small></div><i>${I.check}</i></button>`).join('')}`).join('') : `<div class="empty">${I.search}No hay nada con “${esc(q)}”.${noCreate ? '' : ' Créalo con el botón de abajo.'}</div>`;
      if (!(noCreate && !multi)) { okB.textContent = multi ? (sel.length ? `AGREGAR (${sel.length})` : 'AGREGAR') : 'ELEGIR'; okB.disabled = !sel.length; }
    };
    drawChips(); draw();
    box.querySelector('#exq').addEventListener('input', e => { q = e.target.value; draw(); });
    box.addEventListener('click', async e => {
      const c = e.target.closest('[data-m]'); if (c) { mf = c.dataset.m; drawChips(); draw(); return; }
      const it = e.target.closest('.exi');
      if (it) {
        const id = it.dataset.id, i = sel.indexOf(id);
        if (!multi) { sel.length = 0; sel.push(id); done = true; sh.close(); return; }
        if (i >= 0) sel.splice(i, 1); else sel.push(id);
        it.classList.toggle('on', i < 0); okB.textContent = sel.length ? `AGREGAR (${sel.length})` : 'AGREGAR'; okB.disabled = !sel.length; haptic(); return;
      }
      const x = e.target.closest('[data-x]'); if (!x) return;
      if (x.dataset.x === 'ok') { if (!sel.length) return; done = true; sh.close(); }
      if (x.dataset.x === 'new') { const ne = await createExercise(q); if (ne) { sel.push(ne.id); mf = ''; q = ''; box.querySelector('#exq').value = ''; drawChips(); draw(); } }
    });
  });
}
function createExercise(name) {
  return new Promise(res => {
    let r = null, m = 'PECHO', k = 'wr';
    const sh = sheet({
      title: 'NUEVO EJERCICIO',
      body: `<input class="field" id="cxn" maxlength="48" placeholder="Nombre (ej. Press en Smith)" value="${esc(name || '')}">
        <span class="mono" style="color:var(--mute)">MÚSCULO</span><div class="quick" id="cxm" style="justify-content:flex-start"></div>
        <span class="mono" style="color:var(--mute)">CÓMO SE REGISTRA</span>
        <div class="seg" id="cxk"><button data-k="wr" class="on">PESO×REPS</button><button data-k="bw">CORPORAL</button><button data-k="min">MIN</button><button data-k="sec">SEG</button></div>`,
      foot: `<button class="gn" data-close>CANCELAR</button><button class="gp" data-ok>${I.check} CREAR</button>`,
      onClose: () => res(r),
    });
    const drawM = () => { sh.el.querySelector('#cxm').innerHTML = MUSCLES.map(x => `<button class="chip ${x === m ? 'on' : ''}" data-mm="${x}">${x}</button>`).join(''); };
    drawM();
    sh.el.addEventListener('click', e => {
      const mm = e.target.closest('[data-mm]'); if (mm) { m = mm.dataset.mm; drawM(); return; }
      const kk = e.target.closest('#cxk [data-k]'); if (kk) { k = kk.dataset.k; $$('#cxk button', sh.el).forEach(b => b.classList.toggle('on', b === kk)); return; }
      if (e.target.closest('[data-ok]')) {
        const n = sh.el.querySelector('#cxn').value.trim();
        if (!n) { toast('Ponle nombre', I.info); return; }
        r = { id: 'c-' + uid(), n: n.charAt(0).toUpperCase() + n.slice(1), m, k }; S.custom.push(r); save(); sh.close(); toast('Ejercicio creado', I.check);
      }
    });
  });
}

/* ---------- swipe a set row to delete ---------- */
function initWorkoutEvents() {
  const root = $('#wk'); let st = null;
  root.addEventListener('pointerdown', e => {
    const row = e.target.closest('.set');
    $$('.set.sw', root).forEach(r => { if (r !== row) r.classList.remove('sw'); });
    if (!row || e.target.closest('input') || (e.pointerType === 'mouse' && e.button !== 0)) { st = null; return; }
    st = { row, x: e.clientX, y: e.clientY, dx: 0, on: false, open: row.classList.contains('sw'), id: e.pointerId };
  });
  root.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.on) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { st.on = true; st.row.classList.add('drag'); }
      else if (Math.abs(dy) > 10) { st = null; return; } else return;
    }
    st.dx = dx; st.row.querySelector('.set-in').style.transform = `translateX(${clamp((st.open ? -90 : 0) + dx, -130, 0)}px)`;
  });
  const end = () => {
    if (!st) return; const { row, on, dx, open } = st; st = null; if (!on) return;
    row.classList.remove('drag'); row.querySelector('.set-in').style.transform = '';
    row.classList.toggle('sw', (open ? -90 : 0) + dx < -45);
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
  };
  root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
  root.addEventListener('input', e => {
    const inp = e.target.closest('.inp'); if (!inp) return;
    const { ex, s, row } = ctxSet(inp); if (!s) return;
    const n = parseNum(inp.value);
    if (inp.dataset.f === 'w') s.w = n == null ? null : fromU(Math.max(0, n));
    else s.r = n == null ? null : (exInfo(ex.exId).k === 'min' ? Math.max(0, n) : Math.max(0, Math.round(n)));
    if (s.done && row) updateWkStats();
    save();
  });
  root.addEventListener('keydown', e => {
    const inp = e.target.closest('.inp'); if (!inp || e.key !== 'Enter') return;
    e.preventDefault();
    if (inp.dataset.f === 'w') { const r = inp.closest('.set-in').querySelector('[data-f="r"]'); if (r) r.focus(); } else inp.blur();
  });
}

let flashTO = 0;
function showFlash(opts = {}) {
  const f = $('#flash'), t = S.timer;
  let next = '';
  if (S.active && t.label) {
    const e = S.active.ex.find(x => exInfo(x.exId).n === t.label && x.sets.some(s => !s.done));
    if (e) { const j = e.sets.findIndex(s => !s.done); next = `SERIE ${j + 1} DE ${e.sets.length}`; }
  }
  const late = opts.late ? `<p class="flash-late mono">TERMINÓ HACE ${fmtClock((now() - t.end) / 1000)}</p>` : '';
  f.innerHTML = `<div class="burst"></div><div class="flash-in"><span class="eyebrow pink">DESCANSO TERMINADO</span><h2 class="flash-t chrome-pink">${esc(pick(['A DARLE', 'OTRA SERIE', "LET'S GO", 'VÁMONOS', 'NO DAYS OFF']))}</h2>${t.label ? `<p class="flash-sub">${esc(t.label)}${next ? ' · ' + next : ''}</p>` : ''}${late}<div class="flash-btns"><button class="gn" style="padding:0 22px" data-act="flash-more">+30 S</button><button class="gp" data-act="flash-ok">${I.check} LISTO</button></div></div>`;
  f.classList.add('on');
  Sparks.burst(innerWidth / 2, innerHeight * .44, 110);
  clearTimeout(flashTO); flashTO = setTimeout(() => hideFlash(false), 9000);
}
function hideFlash(hush) {
  const f = $('#flash'); clearTimeout(flashTO);
  if (!f || !f.classList.contains('on')) return;
  f.classList.remove('on'); if (hush) Sound.hush();
  if (S.timer.st === 'done') { S.timer.st = 'idle'; S.timer.left = S.timer.dur; save(); renderTimerState(); }
}
